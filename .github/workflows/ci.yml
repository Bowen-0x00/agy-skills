name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit and security tests
        run: python3 -m unittest discover -s tests -v

      - name: Verify package installation and CLI entry point
        run: |
          python3 -m pip install --no-build-isolation --no-deps . || python3 -m pip install .
          agy-skills --version
          agy-skills --help
          agy-skills list --json > /dev/null
